# Mô phỏng chi phí khi dùng thật — botusieudang. Điền ở guide bước 4.2.
# Mọi số phải có nguồn hoặc ghi rõ "(tự ước tính)". Sau khi có khảo sát: thay share / uses_per_month
# bằng số in ra từ `python evidence/survey/count_survey.py` (câu 7), sửa source cho khớp.
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (50 phiên — bản nộp CP4)

sessions: 50
seed: 42

users:              # người giữ repo / đội trưởng các nhóm L3 (người dùng chính, spec.md §1)
  low: 140
  base: 175
  high: 700
  source: "Lớp L3 hơn 700 học viên (README hackathon trong repo đề — cần kiểm lại). Thấp: 700 ÷ 5 người / nhóm = 140 người giữ repo; cơ sở: 700 ÷ 4 = 175; cao: mọi học viên L3 đều dùng = 700 (tự ước tính)"

personas:           # share cộng lại = 1
  - name: it_tra
    share: 0.5
    uses_per_month: 4       # ~1 lần / tuần
    turns_per_session: 1
    source: "(tự ước tính) thành viên chỉ tra khi sắp nộp — thay bằng tỉ lệ ≤1 lần / tuần ở câu 7 khảo sát"
  - name: tra_vua
    share: 0.35
    uses_per_month: 8       # ~2 lần / tuần
    turns_per_session: 2
    source: "(tự ước tính) người giữ repo tra mỗi checkpoint — thay bằng tỉ lệ 2–4 lần / tuần ở câu 7 khảo sát"
  - name: tra_nhieu
    share: 0.15
    uses_per_month: 20      # ~5 lần / tuần
    turns_per_session: 3
    source: "(tự ước tính) đội trưởng tra liên tục trước mốc — thay bằng tỉ lệ ≥5 lần / tuần ở câu 7 khảo sát"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).

prices:             # USD / 1 triệu token, giá gói trả phí. Đối chiếu lại với further-reading/model-prices.md của repo đề.
  - model: gpt-5.4-nano
    input: 0.20
    output: 1.25
    source: "https://developers.openai.com/api/docs/models/gpt-5.4-nano · xem 27/11/2026"
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-1-flash-lite/ · xem 27/11/2026"
  - model: gpt-5.4-mini
    input: 0.75
    output: 4.50
    source: "Bảng giá OpenAI, trích ở https://the-decoder.com/openai-ships-gpt-5-4-mini-and-nano-faster-and-more-capable-but-up-to-4x-pricier/ · xem 27/11/2026"
# Model đo token (MODEL_NAME trong .env) PHẢI có tên đúng y hệt trong danh sách trên, nếu không simulate không tính được
# dòng "Thực đo". Dùng model khác (vd claude-haiku-5-5) thì thêm giá của nó vào đây, có link + ngày xem.

usd_to_vnd:
  rate:
  source:
